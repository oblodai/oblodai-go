# Go modules publish by tag: pushing vX.Y.Z makes the version resolvable via 'go get'.
# This workflow re-runs the gates, validates the tag and creates a GitHub Release.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: version matches the tag
        run: |
          declared="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' oblodai.go)"
          if [ "v${declared}" != "${GITHUB_REF_NAME}" ]; then
            echo "oblodai.go declares Version ${declared}, but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; echo 'run gofmt -w .'; exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: ./scripts/check-package.sh
      - name: Create GitHub Release
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo 'GITHUB_TOKEN is not available: cannot create the release' >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
