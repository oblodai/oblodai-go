name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; echo 'run gofmt -w .'; exit 1)
      - run: go build ./...
      - run: go vet ./...
      # The drift check and the shared conformance suite need a backend checkout
      # (OBLODAI_BACKEND); without one the drift check says it skipped and conformance skips.
      - run: ./scripts/check-generated.sh
      - run: go test -race ./...
      - run: ./scripts/check-package.sh
